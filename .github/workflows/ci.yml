name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notes
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U notes -d notes"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://notes:ci-test-only@127.0.0.1:5432/notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install checksum-verified upstream native pnpm
        run: node tools/setup-pnpm.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build the pinned upstream synthetic S3 store
        run: docker build --tag windows-ai-notes-minio:ci --file infra/compose/Minio.Dockerfile .
      - name: Start the private synthetic S3 store
        run: |
          docker run --detach --name windows-ai-notes-minio-ci \
            --publish 127.0.0.1:59000:9000 --tmpfs /data:rw,size=512m,mode=1777 \
            --env MINIO_ROOT_USER=storage-test-only \
            --env MINIO_ROOT_PASSWORD=storage-test-only-secret windows-ai-notes-minio:ci
          curl --fail --silent --show-error --max-time 3 --retry 30 --retry-all-errors --retry-delay 1 --retry-max-time 45 \
            http://127.0.0.1:59000/minio/health/live
      - name: PostgreSQL, S3 integrity, private AI and client regressions
        env:
          SERVER_COMPOSE_ACCEPTANCE: '1'
          TEST_S3_ENDPOINT: http://127.0.0.1:59000
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: pnpm test
      - name: Controlled concurrent sync, response loss, restart and overload
        env:
          SERVER_LOAD_ACCEPTANCE: '1'
        run: |
          pnpm test packages/client/src/load-acceptance.test.ts
          test -s artifacts/server-acceptance.json
      - name: Upload body-free controlled server acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: controlled-server-acceptance
          if-no-files-found: error
          path: artifacts/server-acceptance.json
          retention-days: 7
      - name: Physical PostgreSQL crash, WAL recovery and frozen client replay
        env:
          SERVER_DATABASE_CRASH_ACCEPTANCE: '1'
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: pnpm test packages/client/src/database-recovery.test.ts
      - name: Physical PITR, separate media restore and independent deletion recovery
        env:
          SERVER_DATABASE_PITR_ACCEPTANCE: '1'
          TEST_S3_ENDPOINT: http://127.0.0.1:59000
        run: |
          pnpm test packages/client/src/pitr.test.ts
          test -s artifacts/database-pitr-acceptance.json
      - name: Upload body-free controlled physical PITR acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: controlled-database-pitr-acceptance
          if-no-files-found: error
          path: artifacts/database-pitr-acceptance.json
          retention-days: 7
      - run: pnpm format:check
      - name: Build the unprivileged server image without credentials
        run: |
          trap 'rm -f apps/.ci-signing-context-canary.PFX tools/.ci-signing-context-canary.p12' EXIT
          printf '%s\n' 'Synthetic context exclusion fixture; not a certificate.' > apps/.ci-signing-context-canary.PFX
          printf '%s\n' 'Synthetic context exclusion fixture; not a certificate.' > tools/.ci-signing-context-canary.p12
          docker build --tag windows-ai-notes-server:ci .
          docker run --rm --network none --entrypoint /opt/pnpm/pnpm windows-ai-notes-server:ci --version
          docker run --rm --network none --entrypoint node windows-ai-notes-server:ci --input-type=module --eval "import {existsSync} from 'node:fs'; await import('./apps/api/dist/server.js'); await import('./apps/worker/dist/worker.js'); if (process.getuid() === 0) throw new Error('The server must not run as root.'); for (const path of ['apps/.ci-signing-context-canary.PFX', 'tools/.ci-signing-context-canary.p12']) if (existsSync(path)) throw new Error('Signing material entered the server image.'); console.log('Unprivileged runtime imports and signing-material exclusion verified.');"
      - name: Actual hardened Compose containers and readiness probe
        env:
          SERVER_COMPOSE_ACCEPTANCE: '1'
          TEST_SERVER_IMAGE: windows-ai-notes-server:ci
        run: pnpm test packages/client/src/deployment.test.ts
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 25 || 15 }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install checksum-verified upstream native pnpm
        run: node tools/setup-pnpm.mjs
      - run: pnpm install --frozen-lockfile
      - name: Restore locked native dependencies
        run: |
          dotnet restore native/audio-host/AudioHost.Tests/AudioHost.Tests.csproj --locked-mode
          dotnet restore native/audio-host/AudioHost.Windows.Tests/AudioHost.Windows.Tests.csproj --locked-mode
      - name: Cross-build the Windows host and platform tests
        run: dotnet build native/audio-host/AudioHost.Windows.Tests/AudioHost.Windows.Tests.csproj --configuration Release --no-restore
      - name: Crypto, recovery, protocol and synthetic conversion
        run: dotnet test native/audio-host/AudioHost.Tests/AudioHost.Tests.csproj --configuration Release --no-restore
      - name: Current-user Windows DPAPI checks
        if: runner.os == 'Windows'
        run: dotnet test native/audio-host/AudioHost.Windows.Tests/AudioHost.Windows.Tests.csproj --configuration Release --no-build
      - run: pnpm build
      - run: pnpm test
      - name: HTTP-date backoff in a verified non-UTC time zone
        env:
          TZ: Pacific/Honolulu
        run: |
          node -e "if (new Date('2030-01-01T00:00:00Z').getTimezoneOffset() !== 600) throw new Error('Expected the non-UTC backoff fixture time zone.');"
          pnpm test packages/client/src/http.test.ts
      - run: pnpm format:check
      - name: Native formatting
        run: |
          dotnet format whitespace native/audio-host/AudioHost.Core/AudioHost.Core.csproj --verify-no-changes --no-restore
          dotnet format whitespace native/audio-host/AudioHost/AudioHost.csproj --verify-no-changes --no-restore
          dotnet format whitespace native/audio-host/AudioHost.Tests/AudioHost.Tests.csproj --verify-no-changes --no-restore
          dotnet format whitespace native/audio-host/AudioHost.Windows.Tests/AudioHost.Windows.Tests.csproj --verify-no-changes --no-restore
      - name: Publish unsigned self-contained Windows probe
        if: runner.os == 'Windows'
        run: dotnet publish native/audio-host/AudioHost/AudioHost.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/audio-host/win-x64
      - name: Build the offline desktop
        if: runner.os == 'Windows'
        run: pnpm desktop:build
      - name: Real Electron renderer, DPAPI, restart and fail-closed checks
        if: runner.os == 'Windows'
        run: pnpm desktop:test
      - name: Upload body-free Windows library observations
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: controlled-windows-library-observations
          if-no-files-found: error
          path: artifacts/windows-library-observations.json
          retention-days: 7
      - name: Upload body-free Windows saved-history observations
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: controlled-windows-saved-history-observations
          if-no-files-found: error
          path: artifacts/windows-saved-history-observations.json
          retention-days: 7
      - name: Package unsigned developer-preview installer
        if: runner.os == 'Windows'
        run: pnpm desktop:package:unsigned
      - name: Open the packaged application
        if: runner.os == 'Windows'
        env:
          DESKTOP_EXECUTABLE: ${{ github.workspace }}/artifacts/desktop/win-unpacked/Windows AI Notes Preview.exe
        run: pnpm --filter @windows-ai-notes/desktop test:ui tests/packaged.spec.ts
      - name: Actual per-user installation, compatible upgrade, rollback and reinstall
        if: runner.os == 'Windows'
        env:
          DESKTOP_INSTALLATION_PROBE: '1'
        run: pnpm --filter @windows-ai-notes/desktop test:ui tests/installation.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && runner.os == 'Windows'
        with:
          archive: true
          name: desktop-test-diagnostics
          path: apps/desktop/test-results/
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          archive: true
          name: windows-ai-notes-desktop-unsigned
          path: artifacts/desktop/*-unsigned.exe
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          archive: true
          name: audio-host-win-x64-unsigned
          path: artifacts/audio-host/win-x64/
          retention-days: 7
