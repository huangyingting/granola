name: Signed Windows candidate

on:
  workflow_dispatch:
    inputs:
      activation_acceptance:
        description: Build a genuine signed compatible patch pair and exercise Main activation/restart
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: signed-windows-candidate
  cancel-in-progress: false

jobs:
  admission:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
      - name: Require successful Checks for this exact main commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $json = gh run list --workflow ci.yml --commit $env:GITHUB_SHA --branch main --event push --status success --limit 5 --json headSha,status,conclusion
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the source Checks run.' }
          $runs = $json | ConvertFrom-Json
          $verified = @($runs | Where-Object { $_.headSha -eq $env:GITHUB_SHA -and $_.status -eq 'completed' -and $_.conclusion -eq 'success' })
          if ($verified.Count -eq 0) { throw 'This exact main commit needs successful Checks before signing.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require configured signing protections before entering the environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/signing-admission.mjs
  candidate:
    needs: admission
    if: github.ref == 'refs/heads/main'
    environment: signed-release
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Recheck signing protections before dependency installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/signing-admission.mjs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install checksum-verified upstream native pnpm
        run: node tools/setup-pnpm.mjs
      - run: pnpm install --frozen-lockfile
      - name: Build and verify a signed candidate
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          WINDOWS_UPDATE_FEED_URL: ${{ vars.WINDOWS_UPDATE_FEED_URL }}
          ACCEPT_SIGNED_ACTIVATION: ${{ inputs.activation_acceptance }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certificate = Join-Path $env:RUNNER_TEMP ("notes-signing-" + [guid]::NewGuid().ToString('N') + ".pfx")
          $bytes = $null
          try {
            if (-not $env:WINDOWS_SIGNING_PFX_BASE64) { throw 'The signing certificate is not configured.' }
            $bytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64)
            if ($bytes.Length -eq 0 -or $bytes.Length -gt 1048576) { throw 'Invalid signing certificate size.' }
            [IO.File]::WriteAllBytes($certificate, $bytes)
            $env:WINDOWS_SIGNING_PFX_BASE64 = $null
            $env:WIN_CSC_LINK = $certificate
            if ($env:ACCEPT_SIGNED_ACTIVATION -eq 'true') {
              pnpm desktop:package:signed --acceptance-pair
            } else {
              pnpm desktop:package:signed
            }
            if ($LASTEXITCODE -ne 0) { throw 'Signed-candidate build or verification failed.' }
          } finally {
            if ($null -ne $bytes) { [Array]::Clear($bytes, 0, $bytes.Length) }
            $env:WIN_CSC_LINK = $null
            $env:WIN_CSC_KEY_PASSWORD = $null
            $env:WINDOWS_SIGNING_PFX_BASE64 = $null
            if ([IO.File]::Exists($certificate)) { [IO.File]::Delete($certificate) }
          }
      - name: Accept genuine signed Main activation and authenticated restart
        if: inputs.activation_acceptance
        shell: pwsh
        env:
          DESKTOP_SIGNED_ACTIVATION_PROBE: '1'
          WINDOWS_SIGNING_CERT_SHA256: ${{ vars.WINDOWS_SIGNING_CERT_SHA256 }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          WINDOWS_UPDATE_FEED_URL: ${{ vars.WINDOWS_UPDATE_FEED_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm --filter @windows-ai-notes/desktop exec playwright test tests/signed-activation.spec.ts
          if ($LASTEXITCODE -ne 0) { throw 'Genuine signed activation acceptance failed.' }
          $receipt = Join-Path $env:GITHUB_WORKSPACE 'artifacts/desktop-signed/activation-acceptance.json'
          if (-not [IO.File]::Exists($receipt)) { throw 'Signed activation acceptance did not produce its required success receipt; skipped tests are not acceptance.' }
      - name: Upload only the verified installer and public receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: windows-ai-notes-signed-candidate
          if-no-files-found: error
          path: |
            artifacts/desktop-signed/*/*-signed.exe
            artifacts/desktop-signed/*/signed-candidate.json
            artifacts/desktop-signed/*/windows-update.json
            artifacts/desktop-signed/activation-pair.json
            artifacts/desktop-signed/activation-acceptance.json
          retention-days: 7
